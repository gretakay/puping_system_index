<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>權限管理</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 2rem 1rem;
  }
  #login {
    max-width: 320px;
    margin: 4rem auto 0;
    text-align: center;
  }
  #login h2 {
    margin-bottom: 1.5rem;
  }
  #login input {
    width: 100%;
    box-sizing: border-box;
    padding: .6rem;
    font-size: 1rem;
    margin-bottom: .75rem;
  }
  #login button {
    padding: .6rem 1.5rem;
    font-size: 1rem;
    cursor: pointer;
  }
  #panel {
    display: none;
    max-width: 900px;
    margin: 0 auto;
  }
  #topRow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: .5rem;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    background: #fff;
    margin-top: 1rem;
  }
  th, td {
    border: 1px solid #ddd;
    padding: .5rem .75rem;
    text-align: center;
  }
  th { background: #f0f0f0; }
  button { cursor: pointer; }
</style>
</head>
<body>

<div id="login">
  <h2>權限管理登入</h2>
  <input id="codeInput" type="password" placeholder="請輸入管理者代碼" autocomplete="off">
  <br>
  <button onclick="login()">登入</button>
</div>

<div id="panel">
  <div id="topRow">
    <h2>權限管理</h2>
    <div>
      <a href="index.html">回入口網站</a>　|
      <button onclick="logout()">登出</button>
    </div>
  </div>
  <table>
    <thead><tr id="headerRow"></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div style="text-align:center; margin-top:1rem">
    <button onclick="addRow()">新增使用者</button>
  </div>
</div>

<script src="config.js"></script>
<script src="session.js"></script>
<script>
var SYSTEMS = ['物管系統', '會議室預約', '補課查看', '遊覽車'];
var session = makeSession('admin');
var adminCode = null;

document.getElementById('codeInput').addEventListener('keydown', function (evt) {
  if (evt.key === 'Enter') login();
});

function login() {
  var code = document.getElementById('codeInput').value.trim();
  if (!code) return;
  adminCode = code;

  callApi({ action: 'getPermissions' }).then(function (result) {
    if (!result.ok) {
      alert('錯誤：' + result.error);
      adminCode = null;
      return;
    }
    session.save(code, '管理員');
    document.getElementById('login').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    renderTable(result.permissions);
  });
}

function logout() {
  session.clear();
  adminCode = null;
  document.getElementById('panel').style.display = 'none';
  document.getElementById('login').style.display = 'block';
  document.getElementById('codeInput').value = '';
}

function callApi(payload) {
  payload.code = adminCode;
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  }).then(function (r) { return r.json(); });
}

function renderTable(rows) {
  var headerRow = document.getElementById('headerRow');
  headerRow.innerHTML = '<th>代碼</th><th>姓名</th>'
    + SYSTEMS.map(function (s) { return '<th>' + s + '</th>'; }).join('')
    + '<th>操作</th>';

  var body = document.getElementById('tableBody');
  body.innerHTML = '';
  rows.forEach(function (row) { body.appendChild(buildRow(row)); });
}

function buildRow(row) {
  var tr = document.createElement('tr');

  var codeTd = document.createElement('td');
  codeTd.textContent = row['代碼'];
  tr.appendChild(codeTd);

  var nameTd = document.createElement('td');
  var nameInput = document.createElement('input');
  nameInput.value = row['姓名'] || '';
  nameTd.appendChild(nameInput);
  tr.appendChild(nameTd);

  var checkboxes = {};
  SYSTEMS.forEach(function (sys) {
    var td = document.createElement('td');
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!row[sys];
    checkboxes[sys] = cb;
    td.appendChild(cb);
    tr.appendChild(td);
  });

  var actionTd = document.createElement('td');

  var saveBtn = document.createElement('button');
  saveBtn.textContent = '儲存';
  saveBtn.onclick = function () {
    var systemFlags = {};
    SYSTEMS.forEach(function (sys) { systemFlags[sys] = checkboxes[sys].checked; });

    callApi({
      action: 'setPermission',
      targetCode: row['代碼'],
      name: nameInput.value,
      systems: systemFlags
    }).then(function (result) {
      alert(result.ok ? '已儲存' : '儲存失敗：' + result.error);
    });
  };
  actionTd.appendChild(saveBtn);

  var delBtn = document.createElement('button');
  delBtn.textContent = '刪除';
  delBtn.style.marginLeft = '.5rem';
  delBtn.onclick = function () {
    if (!confirm('確定刪除代碼 ' + row['代碼'] + '？')) return;
    callApi({ action: 'removeUser', targetCode: row['代碼'] }).then(function (result) {
      if (!result.ok) {
        alert('刪除失敗：' + result.error);
        return;
      }
      tr.remove();
    });
  };
  actionTd.appendChild(delBtn);

  tr.appendChild(actionTd);
  return tr;
}

function addRow() {
  var code = prompt('請輸入新使用者的代碼：');
  if (!code) return;
  document.getElementById('tableBody').appendChild(buildRow({ '代碼': code, '姓名': '' }));
}

session.initIdleTimeout(logout);
</script>
</body>
</html>
